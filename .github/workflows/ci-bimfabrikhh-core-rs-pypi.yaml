# Publishes bimfabrikhh_core_rs to PyPI when a GitHub Release is published
# Repository: https://github.com/LGV-BIM-Leitstelle/bimfabrikhh_core_rs
#
# Same trigger and trusted-publishing job as ifcfactory. The build jobs use
# maturin because this is a compiled extension: `python -m build` on Ubuntu
# would not produce installable Windows / macOS / manylinux wheels.
#
# Wheels cover every host BIMFabrik and pip hit without compiling:
# Linux glibc + musl (x86_64, aarch64), Windows x64, macOS Intel + Apple Silicon.
# abi3-py311: one wheel per platform works for Python 3.11+.
name: Publish bimfabrikhh_core_rs to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Rust tests
        if: matrix.target == 'x86_64'
        run: cargo test --release

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - name: Install wheel and smoke-import
        if: matrix.target == 'x86_64'
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import bimfabrikhh_core_rs; print(bimfabrikhh_core_rs.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-linux-${{ matrix.target }}
          path: dist/

  musllinux:
    name: musllinux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-musllinux-${{ matrix.target }}
          path: dist/

  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Install wheel and smoke-import
        run: |
          python -m pip install --upgrade pip
          python -m pip install (Get-ChildItem dist\*.whl).FullName
          python -c "import bimfabrikhh_core_rs; print(bimfabrikhh_core_rs.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-windows-${{ matrix.target }}
          path: dist/

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Install wheel and smoke-import
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import bimfabrikhh_core_rs; print(bimfabrikhh_core_rs.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-macos-${{ matrix.target }}
          path: dist/

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-sdist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, sdist]

    permissions:
      # Required for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/bimfabrikhh-core-rs/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
