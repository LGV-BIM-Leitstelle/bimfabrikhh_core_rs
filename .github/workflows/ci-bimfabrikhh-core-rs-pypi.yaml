# Publishes bimfabrikhh_core_rs to PyPI when a GitHub Release is published
# Repository: https://github.com/LGV-BIM-Leitstelle/bimfabrikhh_core_rs
#
# Wheels: Linux x86_64 (WSL/Ubuntu), Windows x64, macOS Apple Silicon.
# No Intel Mac runner (macos-13 is retired). abi3-py311: one wheel per platform for Python 3.11+.
name: Publish bimfabrikhh_core_rs to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Rust tests
        run: cargo test --release

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          manylinux: auto

      - name: Install wheel and smoke-import
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import bimfabrikhh_core_rs; print(bimfabrikhh_core_rs.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-linux-x86_64
          path: dist/

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist

      - name: Install wheel and smoke-import
        run: |
          python -m pip install --upgrade pip
          python -m pip install (Get-ChildItem dist\*.whl).FullName
          python -c "import bimfabrikhh_core_rs; print(bimfabrikhh_core_rs.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-windows-x64
          path: dist/

  macos:
    name: macOS aarch64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist

      - name: Install wheel and smoke-import
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import bimfabrikhh_core_rs; print(bimfabrikhh_core_rs.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-macos-aarch64
          path: dist/

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-sdist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]

    permissions:
      # Required for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/bimfabrikhh-core-rs/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
