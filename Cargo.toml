[package]
name = "bimfabrikhh_core_rs"
version = "0.1.2"
edition = "2021"
description = "Standalone CityGML parse + IFC4 STEP writer (Python bindings)"
authors = ["Ahmed Salem <ahmed.salem@gv.hamburg.de>"]
license = "LGPL-2.1"
readme = "README.md"
# sdist / cargo package: library only. examples, fixtures, and CI stay in git.
exclude = [
    "examples/*",
    "fixtures/*",
    ".github/*",
    ".env.example",
    "output/*",
]

[lib]
name = "bimfabrikhh_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
quick-xml = "0.37"
uuid = { version = "1", features = ["v5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
